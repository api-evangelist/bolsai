  dividends, financial statements, and macroeconomic series sourced from official feeds (B3, CVM, BCB). Covers 350+
  B3 stocks, 400+ FIIs and 40 years of price history, with an official MCP server (hosted OAuth endpoint and PyPI
  package) for AI agents.
